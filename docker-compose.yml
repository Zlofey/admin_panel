services:
  db:
    image: postgres:15-alpine
    container_name: admin-panel-postgres
    env_file:
      - app/config/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  service:
    build: app
    container_name: admin-panel-app
    env_file:
      - app/config/.env
    volumes:
      - static_volume:/opt/app/static
    depends_on:
      - db

  nginx:
    image: nginx:latest
    container_name: admin-panel-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs:/etc/nginx/conf.d:ro
      - static_volume:/data/static/
    depends_on:
      - service
    ports:
      - "80:80"


  elasticsearch:
    image: elasticsearch:9.4.2
    container_name: admin-panel-elastic
    environment:
      - discovery.type=single-node       # Fixes Bootstrap Check #1
      - xpack.security.enabled=false     # Fixes Bootstrap Check #2
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9201:9200"

  redis:
    image: redis:7-alpine
    container_name: admin-panel-redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
  etl:
    build: postgres_to_es
    container_name: admin-panel-etl
    depends_on:
      - redis
      - elasticsearch
      - service

volumes:
  postgres_data:
  static_volume:
  elasticsearch_data:
