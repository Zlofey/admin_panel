services:
  db:
    image: postgres:15-alpine
    env_file:
      - app/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  service:
    build: app
    env_file:
      - app/.env
    volumes:
      - static_volume:/opt/app/static
    expose:
      - "8000"
    depends_on:
      - db

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs:/etc/nginx/conf.d:ro
      - static_volume:/data/static/
    depends_on:
      - service
    ports:
      - "80:80"

volumes:
  postgres_data:
  static_volume:
