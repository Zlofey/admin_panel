services:
  db:
    image: postgres:15-alpine
    env_file:
      - app/config/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  service:
    build: app
    env_file:
      - app/config/.env
    volumes:
      - static_volume:/opt/app/static
    expose:
      - "8000"
    depends_on:
      - db

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./configs:/etc/nginx/conf.d:ro
      - static_volume:/data/static/
    depends_on:
      - service
    ports:
      - "80:80"

  elasticsearch:
    image: elasticsearch:9.4.2
    environment:
      - discovery.type=single-node       # Fixes Bootstrap Check #1
      - xpack.security.enabled=false     # Fixes Bootstrap Check #2
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9201:9200"

volumes:
  postgres_data:
  static_volume:
  elasticsearch_data:
